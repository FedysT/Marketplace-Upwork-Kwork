{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Log in | Taskly{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="text-center mb-4"><div class="brand-mark">t</div><h1 class="h3 fw-bold mt-3">Welcome back</h1><p class="text-muted">Log in to your Taskly account.</p></div><form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-dark w-100 py-2 mt-2">Log in</button></form><p class="text-center small text-muted mt-4 mb-0">New here? <a href="{% url 'register' %}" class="text-dark fw-semibold">Create an account</a></p></div></div>
{% endblock %}
