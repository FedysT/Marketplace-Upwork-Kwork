{% extends "base.html" %}
{% block title %}Edit profile | Taskly{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-page"><h1 class="h2 fw-bold mb-1">Edit profile</h1><p class="text-muted mb-4">Keep your profile useful and up to date.</p><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-dark">Save changes</button></form></div></div>
{% endblock %}
