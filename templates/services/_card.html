<article class="service-card">
    <a href="{% url 'service_detail' service.pk %}" class="service-image-wrap">
        <img src="{{ service.image }}" alt="{{ service.title }}">
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'toggle_favorite' service.pk %}" class="favorite-form">
            {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button class="favorite-btn" type="submit"><i class="bi bi-heart"></i></button>
        </form>
        {% endif %}
    </a>
    <div class="p-3">
        <div class="d-flex align-items-center gap-2 mb-2">
            {% if service.freelancer.avatar_url %}<img class="tiny-avatar" src="{{ service.freelancer.avatar_url }}" alt="">{% else %}<span class="tiny-avatar initials">{{ service.freelancer.username|first|upper }}</span>{% endif %}
            <a class="small text-dark text-decoration-none fw-semibold" href="{% url 'profile' service.freelancer.username %}">{{ service.freelancer.display_name }}</a>
        </div>
        <a href="{% url 'service_detail' service.pk %}" class="service-title">{{ service.title }}</a>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="small text-muted">{{ service.category.name }}</span>
            <strong>From ${{ service.price }}</strong>
        </div>
    </div>
</article>
